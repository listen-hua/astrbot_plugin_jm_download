name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - run: python scripts/build.py --expected-tag "$GITHUB_REF_NAME"
      - name: Publish verified source package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/astrbot_plugin_jm_download-${GITHUB_REF_NAME}.zip"
          dist/SHA256SUMS --verify-tag --title "$GITHUB_REF_NAME"
          --notes-file dist/RELEASE_NOTES.md
